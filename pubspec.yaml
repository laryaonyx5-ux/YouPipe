name: youpipe
description: "YouPipe: an ad-free YouTube client."
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  video_player: ^2.14.1
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  cached_network_image: ^4.0.4
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  xml: ^7.0.1
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  flutter_svg: ^2.3.0
  material_symbols_icons: ^4.2960.0
  crypto: ^3.0.7
  file_picker: ^13.1.0
  webview_flutter: ^4.14.1
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^19.4.2
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  assets:
    - assets/branding/logo.svg
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  min_sdk_android: 24
  image_path: "assets/branding/logo_1024.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/logo_foreground_1024.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/branding/logo_monochrome_1024.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/splash.png
  color_dark: "#0F0F0F"
  image_dark: assets/branding/splash.png
  android_12:
    color: "#FFFFFF"
    image: assets/branding/splash_android12.png
    color_dark: "#0F0F0F"
    image_dark: assets/branding/splash_android12.png
  ios: false
  web: false
